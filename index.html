<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bookytoons Library</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Dust particles -->
  <div class="dust" id="dust"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-ornament">✦ ✦ ✦</div>
    <h1 class="site-title">Bookytoons</h1>
    <p class="site-subtitle">— A Private Reading Room —</p>
    <div class="header-ornament">✦ ✦ ✦</div>
  </header>

  <!-- Shelf scene -->
  <main class="library">
    <div class="shelf-label">~ The Collection ~</div>

    <div class="bookshelf" id="bookshelf">
      <!-- Books injected by JS from books.json -->
    </div>

    <div class="shelf-wood"></div>
    <div class="shelf-shadow"></div>
  </main>

  <!-- Empty state (shown if no books) -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <span class="empty-icon">📚</span>
    <p>The shelves await their stories…</p>
    <small>Add books to <code>books/books.json</code> to populate the library.</small>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>A handcrafted reading room &nbsp;·&nbsp; Procat's Library</p>
  </footer>

  <script src="js/library.js"></script>
</body>
</html>
